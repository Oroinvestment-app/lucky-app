<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Spin & Ticket App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #0088cc;
      --gold-color: #ffd700;
      --text-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid #333;
    }

    .balance-box {
      font-size: 16px;
      font-weight: bold;
      color: var(--gold-color);
    }

    .lang-select {
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 5px;
    }

    .hero {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 0 0 15px 15px;
    }

    .nav-tabs {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background-color: var(--card-bg);
      border-top: 1px solid #333;
      padding: 10px 0;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }

    .page-view {
      display: none;
      padding: 15px;
    }

    .page-view.active {
      display: block;
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 5px;
      background: #000;
      border-radius: 8px;
    }

    .btn-action {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="balance-box"><span id="lbl-balance">Qabeenya:</span> <span id="balance">0</span> ETB</div>
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
      <option value="om">Afaan Oromoo</option>
      <option value="en">English</option>
      <option value="am">አማርኛ</option>
    </select>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    <h2 id="txt-title">Carraa Kee Yaali!</h2>
    <p id="txt-subtitle">Spin godhi ykn Tikkeettii bitachuun badhaasa mo'adhu.</p>
  </div>

  <!-- Pages -->
  <div id="spin-page" class="page-view active">
    <h3 id="txt-spin-header">Geengoo Carraa (Spin Wheel)</h3>
    <p id="txt-spin-desc">Spin godhiitii badhaasa guyyaa keetii fudhadhu.</p>
    <button class="btn-action" id="btn-spin" onclick="spinWheel()">Spin Godhi</button>
  </div>

  <div id="tickets-page" class="page-view">
    <h3 id="txt-ticket-header">Tikkeettii Bitadhu</h3>
    <div class="ticket-grid" id="ticketContainer"></div>
    <button class="btn-action" id="btn-buy-ticket" onclick="buyTicket()">Tikkeettii Biti</button>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-btn active" id="nav-spin" onclick="showPage('spin-page', this)">Spin</button>
    <button class="nav-btn" id="nav-tickets" onclick="showPage('tickets-page', this)">Tikkeettii</button>
  </div>

  <script>
    // Live Backend URL
    const API_URL = "https://lucky-app-seven.vercel.app";

    // Translations Dictionary
    const translations = {
      om: {
        balanceLabel: "Qabeenya:",
        title: "Carraa Kee Yaali!",
        subtitle: "Spin godhi ykn Tikkeettii bitachuun badhaasa mo'adhu.",
        spinHeader: "Geengoo Carraa (Spin Wheel)",
        spinDesc: "Spin godhiitii badhaasa guyyaa keetii fudhadhu.",
        btnSpin: "Spin Godhi",
        ticketHeader: "Tikkeettii Bitadhu",
        btnBuyTicket: "Tikkeettii Biti",
        navSpin: "Spin",
        navTickets: "Tikkeettii"
      },
      en: {
        balanceLabel: "Balance:",
        title: "Try Your Luck!",
        subtitle: "Spin or buy tickets to win prizes.",
        spinHeader: "Spin Wheel",
        spinDesc: "Spin the wheel to get your daily prize.",
        btnSpin: "Spin Now",
        ticketHeader: "Buy Tickets",
        btnBuyTicket: "Buy Ticket",
        navSpin: "Spin",
        navTickets: "Tickets"
      },
      am: {
        balanceLabel: "ቀሪ ሂሳብ:",
        title: "ዕድልዎን ይሞክሩ!",
        subtitle: "ስፒን ያድርጉ ወይም ቲኬት በመግዛት ያሸንፉ።",
        spinHeader: "የዕድል መንኮራኩር",
        spinDesc: "መንኮራኩሩን በማሽከርከር የዕለቱን ሽልማት ይውሰዱ።",
        btnSpin: "ስፒን ያድርጉ",
        ticketHeader: "ቲኬት ይግዙ",
        btnBuyTicket: "ቲኬት ይግዙ",
        navSpin: "ስፒን",
        navTickets: "ቲኬቶች"
      }
    };

    function changeLanguage(lang) {
      const t = translations[lang];
      document.getElementById('lbl-balance').innerText = t.balanceLabel;
      document.getElementById('txt-title').innerText = t.title;
      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('txt-spin-header').innerText = t.spinHeader;
      document.getElementById('txt-spin-desc').innerText = t.spinDesc;
      document.getElementById('btn-spin').innerText = t.btnSpin;
      document.getElementById('txt-ticket-header').innerText = t.ticketHeader;
      document.getElementById('btn-buy-ticket').innerText = t.btnBuyTicket;
      document.getElementById('nav-spin').innerText = t.navSpin;
      document.getElementById('nav-tickets').innerText = t.navTickets;
    }

    function showPage(pageId, btn) {
      document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    }

    function spinWheel() {
      fetch(`${API_URL}/api/spin`, { method: 'POST' })
        .then(res => res.json())
        .then(data => alert(data.message || "Spin Success!"))
        .catch(err => console.error("Error connecting to backend", err));
    }

    function buyTicket() {
      fetch(`${API_URL}/api/ticket`, { method: 'POST' })
        .then(res => res.json())
        .then(data => alert(data.message || "Ticket Purchased!"))
        .catch(err => console.error("Error connecting to backend", err));
    }
  </script>
</body>
</html>
